<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Student Login | SMS Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: linear-gradient(135deg, #4f46e5, #3b82f6); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: #ffffff; width: 420px; border-radius: 12px; padding: 34px; box-shadow: 0 10px 25px rgba(0,0,0,0.15); }
        .header { text-align: center; margin-bottom: 24px; }
        .header i { font-size: 38px; color: #4f46e5; margin-bottom: 8px; }
        .header h2 { margin: 0; color: #1e293b; font-size: 22px; }
        .header p { color: #64748b; font-size: 13px; margin-top: 4px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 6px; }
        input { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; outline: none; }
        input:focus { border-color: #4f46e5; }
        .btn-submit { width: 100%; padding: 11px; background-color: #4f46e5; border: none; color: #ffffff; font-size: 15px; font-weight: 600; border-radius: 6px; cursor: pointer; margin-top: 10px; }
        .btn-submit:hover { background-color: #4338ca; }
        .footer-link { text-align: center; margin-top: 18px; font-size: 13px; color: #64748b; }
        .footer-link a { color: #4f46e5; text-decoration: none; font-weight: 600; }
        .alert { padding: 10px; border-radius: 6px; font-size: 13px; margin-bottom: 15px; text-align: center; }
        .alert-danger { background-color: #fee2e2; color: #b91c1c; }
        .alert-info { background-color: #e0f2fe; color: #0369a1; }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <i class="fa-solid fa-graduation-cap"></i>
        <h2>Student LMS Portal</h2>
        <p>Enter your student credentials to continue</p>
    </div>

    <div th:if="${param.error}" class="alert alert-danger">Invalid email or password!</div>
    <div th:if="${param.logout}" class="alert alert-info">Logged out successfully.</div>
    <div th:if="${param.registered}" class="alert alert-info">Registration successful! Please login.</div>

    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label>Student Email</label>
            <input type="email" name="username" placeholder="student@sms.com" required />
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" placeholder="••••••••" required />
        </div>

        <button type="submit" class="btn-submit">Sign In as Student</button>
    </form>

    <div class="footer-link">
        Are you an administrator? <a href="/admin/login">Admin Login</a>
    </div>
</div>

</body>
</html>
