<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | SMS Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { 
            background: linear-gradient(135deg, #1e2530 0%, #2a3447 50%, #1a202c 100%);
            min-height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 20px;
        }

        .login-card { 
            background: #ffffff; 
            width: 100%; 
            max-width: 430px; 
            border-radius: 14px; 
            padding: 38px 32px; 
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3); 
            text-align: center;
        }

        .brand-icon {
            width: 60px;
            height: 60px;
            background: #fee2e2;
            color: #e03131;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            margin: 0 auto 16px;
        }

        h2 { color: #1e293b; font-size: 24px; font-weight: 700; margin-bottom: 6px; }
        .subtitle { color: #64748b; font-size: 13px; margin-bottom: 24px; }

        .form-group { margin-bottom: 18px; text-align: left; }
        label { display: block; font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 6px; }
        input { 
            width: 100%; 
            padding: 11px 14px; 
            border: 1px solid #cbd5e1; 
            border-radius: 8px; 
            font-size: 14px; 
            outline: none; 
            transition: 0.2s;
        }
        input:focus { border-color: #e03131; box-shadow: 0 0 0 3px rgba(224, 49, 49, 0.12); }

        .btn-submit { 
            width: 100%; 
            padding: 12px; 
            background-color: #e03131; 
            border: none; 
            color: #ffffff; 
            font-size: 15px; 
            font-weight: 600; 
            border-radius: 8px; 
            cursor: pointer; 
            margin-top: 8px; 
            transition: 0.2s;
        }
        .btn-submit:hover { background-color: #c92a2a; }

        .alert { padding: 10px 14px; border-radius: 6px; font-size: 13px; margin-bottom: 16px; text-align: left; }
        .alert-danger { background-color: #fee2e2; color: #b91c1c; border: 1px solid #fecaca; }
        .alert-info { background-color: #e0f2fe; color: #0369a1; border: 1px solid #bae6fd; }

        .card-footer { 
            margin-top: 22px; 
            padding-top: 18px; 
            border-top: 1px solid #f1f5f9; 
            font-size: 13px; 
            color: #64748b; 
        }
        .card-footer a { color: #4f46e5; text-decoration: none; font-weight: 600; }
        .card-footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="login-card">
    <div class="brand-icon">
        <i class="fa-solid fa-shield-halved"></i>
    </div>
    <h2>Admin Portal</h2>
    <p class="subtitle">Secure administrative access</p>

    <!-- Alerts -->
    <div th:if="${param.error}" class="alert alert-danger">
        <i class="fa-solid fa-triangle-exclamation"></i> Invalid admin credentials!
    </div>
    <div th:if="${param.logout}" class="alert alert-info">
        <i class="fa-solid fa-circle-check"></i> Logged out successfully.
    </div>

    <!-- Login Form -->
    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label>Admin Email</label>
            <input type="email" name="username" placeholder="admin@sms.com" required />
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" placeholder="••••••••" required />
        </div>

        <button type="submit" class="btn-submit">Secure Login</button>
    </form>

    <!-- Footer properly enclosed inside card -->
    <div class="card-footer">
        Are you a student? <a href="/student/login">Student Portal Login</a>
    </div>
</div>

</body>
</html>
