<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal | SMS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f4f7f6; min-height: 100vh; display: flex; flex-direction: column; }

        /* Navigation Header */
        header { background: #ffffff; height: 65px; display: flex; align-items: center; justify-content: space-between; padding: 0 32px; box-shadow: 0 2px 6px rgba(0,0,0,0.04); }
        .logo { font-size: 19px; font-weight: 700; color: #2e384d; display: flex; align-items: center; gap: 8px; }
        .logo i { color: #5a73e8; }
        .user-nav { display: flex; align-items: center; gap: 16px; font-size: 14px; }
        .btn-logout { background-color: #fee2e2; color: #dc2626; text-decoration: none; padding: 6px 12px; border-radius: 6px; font-weight: 600; font-size: 13px; }

        .container { max-width: 1050px; margin: 30px auto; padding: 0 20px; width: 100%; }

        /* Student Welcome Card */
        .welcome-card { background: linear-gradient(135deg, #5a73e8, #4e73df); color: #ffffff; border-radius: 12px; padding: 28px; margin-bottom: 24px; box-shadow: 0 4px 14px rgba(90, 115, 232, 0.2); }
        .welcome-card h2 { font-size: 24px; margin-bottom: 6px; }
        .welcome-card p { font-size: 14px; opacity: 0.85; }

        /* Stat Grid */
        .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-bottom: 24px; }
        .card { background: #ffffff; border-radius: 10px; padding: 22px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); display: flex; justify-content: space-between; align-items: center; }
        .card-label { font-size: 13px; font-weight: 600; color: #8795a1; text-transform: uppercase; margin-bottom: 6px; }
        .card-value { font-size: 26px; font-weight: 700; color: #2e384d; }
        .card-icon { font-size: 34px; color: #cbd5e1; }

        /* Table Card */
        .table-card { background: #ffffff; border-radius: 10px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
        .table-title { font-size: 16px; font-weight: 700; color: #2e384d; margin-bottom: 18px; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { font-size: 12px; font-weight: 700; color: #8795a1; text-transform: uppercase; padding: 12px 16px; border-bottom: 2px solid #eef2f5; }
        td { font-size: 14px; color: #495057; padding: 16px; border-bottom: 1px solid #f1f5f8; vertical-align: middle; }
        .badge { background: #e0f2fe; color: #0284c7; padding: 4px 10px; border-radius: 6px; font-weight: 600; font-size: 13px; }
        .empty-text { text-align: center; color: #9aa0ac; padding: 25px; font-size: 14px; }

        /* Receipt Button */
        .btn-receipt { background-color: #0284c7; color: #ffffff; padding: 6px 12px; border-radius: 6px; text-decoration: none; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; transition: 0.2s; }
        .btn-receipt:hover { background-color: #0369a1; }
    </style>
</head>
<body>

<header>
    <div class="logo">
        <i class="fa-solid fa-graduation-cap"></i> Student Portal
    </div>
    <div class="user-nav">
        <span>Logged in as: <b th:text="${student.fullName}">Student Name</b></span>
        <a th:href="@{/logout}" class="btn-logout"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
    </div>
</header>

<div class="container">
    <div class="welcome-card">
        <h2>Welcome back, <span th:text="${student.fullName}">Student</span>!</h2>
        <p th:text="'Email: ' + ${student.username}">student@sms.com</p>
    </div>

    <!-- Student Stats -->
    <div class="stats-grid">
        <div class="card">
            <div>
                <div class="card-label">My Enrolled Courses</div>
                <div class="card-value" th:text="${totalCourses}">0</div>
            </div>
            <i class="fa-solid fa-book-open card-icon"></i>
        </div>
        <div class="card">
            <div>
                <div class="card-label">Total Fee Paid</div>
                <div class="card-value" style="color: #10b981;" th:text="'₹ ' + ${#numbers.formatDecimal(totalFee, 1, 2)}">₹ 0.00</div>
            </div>
            <i class="fa-solid fa-indian-rupee-sign card-icon"></i>
        </div>
    </div>

    <!-- Enrolled Courses Table -->
    <div class="table-card">
        <div class="table-title">My Courses</div>
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>COURSE NAME</th>
                    <th>ENROLLMENT DATE</th>
                    <th>PAID FEE</th>
                    <th style="text-align: center;">ACTION</th>
                </tr>
            </thead>
            <tbody>
                <tr th:if="${#lists.isEmpty(enrollments)}">
                    <td colspan="5" class="empty-text">You have not enrolled in any course yet.</td>
                </tr>
                <tr th:each="en, iter : ${enrollments}">
                    <td th:text="${iter.count}">1</td>
                    <td><span class="badge" th:text="${en.courseName}">Python Full Stack</span></td>
                    <td th:text="${en.enrollDate}">2026-09-07</td>
                    <td th:text="'₹ ' + ${#numbers.formatDecimal(en.fee, 1, 2)}">₹ 20000.00</td>
                    <td style="text-align: center;">
                        <a th:href="@{'/student/receipt/' + ${en.id}}" target="_blank" class="btn-receipt">
                            <i class="fa-solid fa-file-invoice"></i> Receipt
                        </a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
