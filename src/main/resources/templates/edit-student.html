<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Student | SMS Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #eef2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: #ffffff; width: 440px; border-radius: 12px; padding: 32px; box-shadow: 0 4px 16px rgba(0,0,0,0.06); }
        h3 { margin-top: 0; color: #2e384d; margin-bottom: 22px; text-align: center; font-size: 20px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 13px; font-weight: 600; color: #495057; margin-bottom: 6px; }
        input { width: 100%; padding: 10px 12px; border: 1px solid #ced4da; border-radius: 6px; font-size: 14px; outline: none; }
        input:focus { border-color: #5a73e8; }
        input[readonly] { background-color: #f1f5f9; cursor: not-allowed; color: #64748b; }
        .note { font-size: 12px; color: #8795a1; margin-top: 4px; }
        .btn-submit { width: 100%; padding: 11px; background-color: #5a73e8; border: none; color: #ffffff; font-size: 15px; font-weight: 600; border-radius: 6px; cursor: pointer; margin-top: 10px; }
        .btn-submit:hover { background-color: #4a60c7; }
        .btn-cancel { display: block; text-align: center; margin-top: 12px; color: #78909c; text-decoration: none; font-size: 13px; }
    </style>
</head>
<body>

<div class="card">
    <h3><i class="fa-solid fa-user-pen" style="color: #5a73e8; margin-right: 8px;"></i>Edit Student</h3>

    <form th:action="@{'/admin/students/edit/' + ${student.id}}" method="post">
        <!-- Email / Username (Read-only identifier) -->
        <div class="form-group">
            <label>Student Email (Username)</label>
            <input type="email" th:value="${student.username}" readonly />
        </div>

        <!-- Full Name -->
        <div class="form-group">
            <label>Full Name</label>
            <input type="text" name="fullName" th:value="${student.fullName}" required />
        </div>

        <!-- Reset Password (Optional) -->
        <div class="form-group">
            <label>New Password (Optional)</label>
            <input type="password" name="newPassword" placeholder="Leave empty to keep current password" />
            <div class="note">Sirf tab fill karein agar password change karna ho.</div>
        </div>

        <button type="submit" class="btn-submit">Update Student</button>
        <a href="/admin/dashboard" class="btn-cancel">Cancel</a>
    </form>
</div>

</body>
</html>
